---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%b %-d, %Y" }}{% if page.author %} • {{ page.author }}{% endif %}{% if page.meta %} • {{ page.meta }}{% endif %}</p>
  </header>

  <article class="post-content">
  {{ content }}
  </article>

  <!-- JSON-LD Structured Data: BlogPosting -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{ page.title | escape }}",
    "url": "{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}",
    "datePublished": "{{ page.date | date: '%Y-%m-%d' }}",
    "author": {
      "@type": "Person",
      "name": "{{ site.author }}"
    },
    "description": "{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}"
  }
  </script>

  <!-- Artalk Comment System -->
  <div id="Comments"></div>
  <script src="https://artalk.kaifei.net/dist/Artalk.js"></script>
  <script>
  Artalk.init({
    el:        '#Comments',
    pageKey:   '{{ page.url }}',
    pageTitle: '{{ page.title }}',
    server:    'https://artalk.kaifei.net',
    site:      '{{ site.title }}',
  })
  </script>

</div>
